<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Muito obrigado por acompanhar com a gente a checagem do debate presidencial.">
  <title>Checagem ao Vivo — Muito obrigado</title>
  <style>
    :root { color-scheme: dark; --yellow: #ffd600; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 1000px); min-height: 100svh; margin: auto; padding: clamp(28px, 5vw, 64px) clamp(20px, 5vw, 60px); display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .eyebrow { margin: 0 0 clamp(32px, 5vw, 56px); font-size: clamp(12px, 2.5vw, 22px); font-weight: 700; letter-spacing: .16em; color: #bdbdbd; }
    .dot { width: clamp(22px, 4vw, 40px); height: clamp(22px, 4vw, 40px); flex: none; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 13px #ffd60033; margin: 0 auto 35px; }
    h1 { font-size: clamp(32px, 10.2vw, 105px); font-weight: 900; line-height: .95; letter-spacing: -.065em; margin: 0; }
    h1 span { display: block; color: var(--yellow); font-size: 1.11em; margin-top: 8px; }
    .thanks { border-top: 1px solid #555; margin-top: clamp(30px, 5vw, 52px); padding-top: clamp(25px, 4vw, 40px); }
    .thanks p { margin: 0 auto; max-width: 20em; font-size: clamp(18px, 3.6vw, 32px); font-weight: 800; line-height: 1.3; }
    @media (max-width: 360px) { .eyebrow { letter-spacing: .1em; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CHECAGEM AO VIVO</p>
    <div class="dot" aria-hidden="true"></div>
    <h1>MUITO<span>OBRIGADO</span></h1>
    <section class="thanks">
      <p>por acompanhar com a gente a checagem do debate presidencial.</p>
    </section>
  </main>

</body>
</html>
